[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "ecopilot"
version = "0.2.0"
description = "Safety-constrained agentic EnergyPlus controller for the Honeywell hackathon"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "python-dotenv>=1.0,<2",
  "mcp[cli]>=1.27,<2",
  "ollama>=0.5,<1",
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "scikit-learn>=1.5,<2",
  "joblib>=1.4,<2",
  "streamlit>=1.40,<2",
  "streamlit-autorefresh>=1.0.1,<2",
  "plotly>=5.24,<7",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["."]
include = [
  "core*",
  "agent*",
  "control*",
  "dashboard*",
  "energyplus*",
  "mcp_server*",
  "experiments*",
  "scripts*",
]
exclude = ["tests*", "data*", "models*", "docs*"]
